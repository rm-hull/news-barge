name: Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          # Pin to ref "main" so that checkout fetches the current
          # HEAD of main rather than the stale github.sha captured at
          # trigger time (important for scheduled workflows that may be
          # queued behind other runs).
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Generate chart
        run: uv run .github/scripts/scrape_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/scrape_stats.png
          git diff --cached --quiet || git commit -m "chore: update scrape stats [skip ci]" --no-verify
          git push || {
            echo "Push rejected, syncing with remote and rebasing..."
            git fetch origin main
            git rebase origin/main
            git push
          }