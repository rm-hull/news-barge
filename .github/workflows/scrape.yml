name: Scrape and publish

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Site slug to scrape (leave blank for all)"
        required: false
      dry_run:
        description: "Dry run (no commits)"
        type: boolean
        default: false
      force:
        description: "Force overwrite if article already exists"
        type: boolean
        default: false
      retention_months:
        description: "Don't create articles older than this many months"
        required: false
        type: string
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-and-publish"
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape articles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch 2 commits so git rebase has a common ancestor when
          # the remote has advanced during a queued run.
          fetch-depth: 2
          # Use the triggering ref (branch) for manual dispatch, falling
          # back to main for scheduled runs. This ensures CI tests the
          # actual feature branch code, not stale main HEAD.
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "scraper/uv.lock"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scraper/uv.lock') }}

      - name: Cache flair NER model
        uses: actions/cache@v6
        with:
          path: ~/.flair/models
          key: ${{ runner.os }}-flair

      - name: Cache taxotag model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-taxotag-gist-v2.2.0-${{ hashFiles('scraper/uv.lock') }}

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Run scraper
        working-directory: ./scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.site }}" ]; then
            ARGS="--site ${{ github.event.inputs.site }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ARGS="$ARGS --retention-months ${{ github.event.inputs.retention_months || '1' }}"
          uv run scrape $ARGS

      - name: Commit new content
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new articles."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "scrape: add ${COUNT} article(s) [$(date -u +%Y-%m-%d)] [skip-ci]"
            # Push may fail if the remote main has advanced while we were
            # scraping (e.g. another workflow run pushed new commits).
            # Fetch the latest and rebase our commit on top, then retry.
            git push || {
              echo "Push rejected, syncing with remote and rebasing..."
              git fetch origin main
              git rebase origin/main
              git push
            }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build site and deploy
    needs: scrape
    # Always build on manual dispatch; on schedule only if there's new content; skip for branch pushes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (needs.scrape.outputs.changed == 'true' && !(github.event_name == 'push' && github.ref_type == 'branch'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
