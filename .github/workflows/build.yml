name: Build and check

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
  pull_request:
    paths:
      - "scraper/**"

jobs:
  python-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "scraper/uv.lock"

      - name: Install dependencies
        working-directory: ./scraper
        run: uv sync --group dev

      - name: Lint (ruff check)
        working-directory: ./scraper
        run: uv run ruff check scrape.py backfill_categories.py

      - name: Format check (ruff format)
        working-directory: ./scraper
        run: uv run ruff format --check scrape.py backfill_categories.py

      - name: Type check (mypy)
        working-directory: ./scraper
        run: uv run mypy scrape.py backfill_categories.py
