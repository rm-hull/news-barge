# Add or remove sites here.
# Each entry crawls a list of URLs or a feed.
#
# Fields:
#   name:       Human-readable label (used in the index)
#   slug:       Short identifier, used in filenames (no spaces)
#.  categories: List of categories to assign to articles from this site
#   urls:       List of specific article URLs to scrape
#   feed:       RSS/Atom feed URL — scraper will pull latest N items
#   limit:      Max articles to pull from feed or listing (default: 10)
#   force_playwright: Set true if the site needs a real browser (JS-heavy)
#.  exclude_query_params: Set true to omit query params from the slug name
#.  exclusions:          List of XPath expressions (or bare attr="value"
#                        matchers like role="dialog") for page elements to
#                        strip BEFORE trafilatura extraction. Use this to
#                        drop site chrome that otherwise leaks into the article
#                        — e.g. bookmark/membership modals, subscribe overlays,
#                        paywall prompts. Examples:
#                          exclusions:
#                            - role="dialog"                      # bare attr form
#                            - //div[contains(@class, "modal")]   # full XPath
#                            - //script | //style
#   notes:      Freeform reminder

sites:
  - name: The Guardian
    slug: guardian
    categories: [UK, News & Politics]
    feed: https://www.theguardian.com/world/rss
    limit: 50

  - name: BBC News
    slug: bbc
    categories: [UK, News & Politics]
    feed: https://feeds.bbci.co.uk/news/rss.xml
    exclude_query_params: true
    limit: 50

  - name: Harrogate Advertiser
    slug: harrogate-advertiser
    categories: [Local, Harrogate]
    listing_url: https://www.harrogateadvertiser.co.uk/news/latest
    listing_link_pattern: "/news/"
    limit: 100

  - name: Harrogate News
    slug: harrogate-news
    categories: [Local, Harrogate]
    listing_url: https://www.harrogate-news.co.uk/
    listing_link_pattern: /\d{4}/\d{2}/\d{2}/
    limit: 50

  - name: Your Harrogate
    slug: your-harrogate
    categories: [Local, Harrogate]
    feed: https://www.yourharrogate.co.uk/local-news/harrogate/feed.xml
    limit: 50

  - name: Harrogate Town Council
    slug: harrogate-town-council
    feed: https://harrogatetowncouncil.gov.uk/feed/
    limit: 100
    categories: [Local, Harrogate, Government]

  - name: BBC News - Harrogate
    slug: bbc-harrogate
    categories: [Local, Harrogate]
    feed: https://feeds.bbci.co.uk/news/topics/cnx753jene1t/rss.xml
    exclude_query_params: true
    limit: 50

  - name: York Mix
    slug: york-mix
    categories: [Local, York]
    listing_url: https://www.yorkmix.com/archive/news
    listing_class: "category-news"
    resolve_relative_to_root: true
    limit: 100

  - name: York Press
    slug: york-press
    categories: [Local, York]
    listing_url: https://www.yorkpress.co.uk/news/
    force_playwright: true
    listing_class: "omnicard"
    listing_link_pattern: "/news/"
    resolve_relative_to_root: true
    limit: 50

  - name: Tom's Hardware
    slug: toms-hardware
    categories: [Technology & Software, Hardware]
    listing_url: https://www.tomshardware.com/uk/news
    listing_class: "listingResult"
    limit: 100

  - name: TechRadar UK
    slug: techradar-uk
    categories: [Technology & Software]
    feed: https://www.techradar.com/uk/feeds.xml
    limit: 100
    # TechRadar injects several footer blocks into article pages that
    # leak into the extracted prose: the author bio, a "Follow on Google
    # News" inline call-to-action, and a viafoura comment-login overlay.
    # Strip them out *before* trafilatura runs so their text never merges
    # into the article body.
    exclusions:
      # Author byline / bio block at the end of the article ("Christian …").
      - //div[contains(@class, 'slice-author-bio')]
      # The "Follow TechRadar on Google News" inline CTA embedded in #article-body.
      - //p[contains(., 'Follow TechRadar on Google News')]
      # Viafoura "confirm your public display name" comment-login overlay.
      - x-show="showConfirmDisplayNamePrompt"

  - name: Euronews
    slug: euronews
    categories: [Europe, News & Politics]
    listing_url: https://www.euronews.com/news
    listing_link_pattern: "\\d{4}/\\d{2}/\\d{2}"
    resolve_relative_to_root: true
    force_playwright: true
    limit: 100

  - name: Gazette & Herald
    slug: gazette-herald
    categories: [Local, Harrogate, York]
    feed: https://www.gazetteherald.co.uk/News/rss/
    limit: 100

  - name: Wired
    slug: wired
    categories: [Technology & Software, Science]
    feed: https://www.wired.com/feed/rss
    limit: 100

  - name: New Scientist
    slug: new-scientist
    feed: https://www.newscientist.com/feed/home/
    force_playwright: true
    limit: 50
    categories: [Science, Technology & Software]

  - name: The Independent
    slug: independent
    # Homepage /rss mixes in sport, arts/entertainment, lifestyle and AP
    # bulletins. The News section feed keeps it to straight news coverage.
    feed: https://www.independent.co.uk/news/rss
    limit: 100
    categories: [News & Politics, UK]
    # The Independent injects a membership / bookmark modal into article
    # pages. Strip it out before extraction so the "Become a member"
    # paywall copy never leaks into the rendered article.
    exclusions:
      - role="dialog"

  - name: North Yorkshire Council
    slug: north-yorkshire-council
    listing_url: https://www.northyorks.gov.uk/news
    listing_link_pattern: "/news/[0-9]{4}/"
    resolve_relative_to_root: true
    limit: 50
    categories: [Local, York, Harrogate, Government]

  - name: Knaresborough Town Council
    slug: knaresborough-town-council
    listing_url: "https://www.knaresboroughtowncouncil.gov.uk/News_and_Events_21581.aspx"
    listing_class: "news"
    resolve_relative_to_root: true
    limit: 50
    trust_insecure_certs: true
    categories: [Local, Government, Knaresborough]

  - name: Yorkshire Post
    slug: yorkshire-post
    feed: https://www.yorkshirepost.co.uk/news/rss
    categories: [Local, Harrogate, York]
    limit: 100

  - name: The Northern Echo
    slug: northern-echo
    categories: [Local, UK, News & Politics]
    feed: https://www.thenorthernecho.co.uk/news/rss/
    exclude_query_params: true
    limit: 50

  - name: Telegraph & Argus
    slug: telegraph-and-argus
    categories: [Local, Bradford, News & Politics]
    feed: https://www.thetelegraphandargus.co.uk/news/rss/
    exclude_query_params: true
    limit: 50

  - name: Der Spiegel International
    slug: spiegel-international
    feed: https://www.spiegel.de/international/index.rss
    categories: [Berlin, Germany, News & Politics]
    limit: 50

  - name: Berlin News
    slug: berlin-news
    feed: https://www.berlin.de/en/news/index.rss
    categories: [Berlin, Germany, News & Politics]
    limit: 50

  - name: The Berliner
    slug: the-berliner
    listing_url: https://www.the-berliner.com/english-news-berlin/
    force_playwright: true
    listing_link_pattern: "/english-news-berlin/"
    remove_suffix: "- The Berliner"
    limit: 50
    categories: [Berlin, Germany, News & Politics]


  - name: The Local Germany
    slug: the-local-germany
    feed: https://feeds.thelocal.com/rss/builder/de
    categories: [Berlin, Germany, News & Politics]
    limit: 50








